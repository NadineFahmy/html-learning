<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Form</title>
</head>
<body>
    <h1>Form</h1>
    
    <form action="submit.php" method="get" target="_blank" novalidate>
        <label for="search">Search</label>
        <input type="text" id="search" name="search" placeholder="Enter A Search Word" autofocus>
        <br><br>
        
        <label for="file">File</label>
        <input type="file" id="file" name="file">
        <br><br>
        
        <label for="url">URL</label>
        <input type="url" id="url" name="url" required>
        <br><br>
        
        <label for="date">Date</label>
        <input type="date" id="date" name="date" value="1982-10-25">
        <br><br>
        
        <label for="month">Month</label>
        <input type="month" id="month" name="month" value="1982-10">
        <br><br>
        
        <button type="reset">Empty</button>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
