<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player Page</title>
</head>
<body>
    <header>
        <h1>Video Player Demo</h1>
    </header>

    <main>
        <section>
            <h2>Watch Our Video</h2>
            
            <video controls autoplay muted poster="https://via.placeholder.com/800x450" width="800" height="450">
                <source src="video-file.mp4" type="video/mp4">
                <source src="video-file.webm" type="video/webm">
                <source src="video-file.ogg" type="video/ogg">
                
                <track src="subtitles-en.vtt" kind="subtitles" srclang="en" label="English">
                <track src="subtitles-ar.vtt" kind="subtitles" srclang="ar" label="Arabic">
                
                Your browser does not support the video element. Please upgrade your browser to watch this video.
            </video>
            
            <p>This video plays automatically when the page loads with no sound. You can enable subtitles in English or Arabic.</p>
        </section>
    </main>

    <footer>
        <p>Copyright 2021 &copy;</p>
    </footer>
</body>
</html>
